<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/Style/App.css?v=2">
  <link rel="icon" href="/images/favicon.png">
  <script src="/js/FieldPage.js?v=2" defer></script>
  <title>Start a private room — AnonymChat</title>
</head>
<body class="field-page">
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="brand" href="/WelcomeServlet">Home</a>
    <div class="nav-links"><a href="/Models/AboutUs.html">About Us</a><a href="/Models/Conctact.html">Contact</a></div>
  </nav>

  <main class="page-shell form-page">
    <header class="form-intro">
      <h1 class="display-title">Create New Private Chat</h1>
      <p class="lede">The room stays out of public search, and every guest receives a personal invitation.</p>
      <p class="form-intro-note">Each invitation can only be claimed once.</p>
    </header>

    <form class="room-form" action="/PrivateChatServlet" method="post" id="privateRoomForm">
      <div class="field">
        <label for="name">Room name</label>
        <input id="name" name="name" maxlength="100" required placeholder="Sunday plans, quietly">
      </div>
      <div class="field">
        <label for="description">Chat description</label>
        <textarea id="description" name="description" maxlength="1000" required placeholder="What is this chat about?"></textarea>
      </div>
      <div class="field">
        <label for="numMembers">Number of members</label>
        <input id="numMembers" name="numMembers" type="number" min="2" max="12" value="3" required>
        <p class="field-help">Private rooms support 2–12 people.</p>
      </div>
      <div class="invitation-fields" id="memberList" aria-live="polite"></div>
      <div class="form-footer">
        <small>Invitations are sent after the room is created.</small>
        <button class="button form-button" type="submit">Create</button>
      </div>
    </form>
  </main>
</body>
</html>
