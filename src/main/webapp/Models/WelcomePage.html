<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse live public rooms or create one of your own.">
  <link rel="stylesheet" href="/Style/App.css?v=2">
  <link rel="icon" href="/images/favicon.png">
  <script src="/js/WelcomePage.js?v=2" defer></script>
  <title>Open rooms — AnonymChat</title>
</head>
<body class="lobby-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="brand" href="/WelcomeServlet">Home</a>
    <div class="nav-links">
      <a href="/Models/AboutUs.html">About Us</a>
      <a href="/Models/Conctact.html">Contact</a>
    </div>
  </nav>

  <main class="page-shell" id="main">
    <div class="lobby-logo">
      <img src="/images/logo.jpg" alt="AnonymChat">
    </div>

    <section class="lobby-controls" aria-label="Room controls">
      <form class="search-form" id="roomSearch" role="search">
        <label class="skip-link" for="searchLine">Search rooms</label>
        <input id="searchLine" name="line" type="search" maxlength="100" placeholder="Type keywords…">
        <button type="submit">Search</button>
      </form>
      <div class="lobby-actions">
        <a class="button button-public" href="/Models/PublicChatFields.html">New Public Chat</a>
        <a class="button button-private" href="/Models/PrivateChatFields.html">New Private Chat</a>
      </div>
    </section>

    <div class="notice" id="lobbyNotice" role="status"></div>

    <section aria-labelledby="roomsTitle">
      <div class="room-toolbar">
        <div>
          <h1 class="section-title" id="roomsTitle">Open Chats</h1>
          <p class="section-kicker" id="roomResultLabel">Live presence only—no invented popularity numbers.</p>
        </div>
      </div>
      <div class="room-grid" id="roomsDiv" aria-live="polite">
        <div class="loading-state">Loading open chats…</div>
      </div>
    </section>
  </main>
</body>
</html>
