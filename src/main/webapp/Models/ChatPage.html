<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="stylesheet" href="/Style/App.css">
  <link rel="icon" href="/images/favicon.png">
  <script src="/js/ClientEndpoint.js" defer></script>
  <title>Room — AnonymChat</title>
</head>
<body class="chat-body">
  <a class="skip-link" href="#messages">Skip to messages</a>
  <main class="chat-shell">
    <header class="chat-header">
      <a class="chat-home" href="/WelcomeServlet" aria-label="Leave room and return to lobby">←</a>
      <div class="room-identity">
        <h1 id="chatName">Entering room…</h1>
        <p id="chatDescription">Your temporary name will appear when connected.</p>
      </div>
      <div class="connection-status" id="connectionStatus" role="status">Connecting</div>
    </header>

    <section class="chat-main" aria-label="Conversation">
      <div class="messages" id="messages" aria-live="polite" aria-relevant="additions">
        <p class="history-note" id="historyNote">Loading room history</p>
      </div>
    </section>

    <form class="chat-composer" id="messageForm" autocomplete="off">
      <div class="composer-field">
        <label class="skip-link" for="textInput">Message</label>
        <input id="textInput" maxlength="2000" placeholder="Write what you mean…" disabled>
      </div>
      <button class="send-button" id="sendButton" type="submit" disabled>Send</button>
      <div class="command-bar" aria-label="Room bot shortcuts">
        <button class="command-chip" type="button" data-command="BOT:RANDOM USER">Random person</button>
        <button class="command-chip" type="button" data-command="BOT:RANDOM NUMBER">Random number</button>
        <button class="command-chip" type="button" data-command="BOT:GUESS">Start a guess</button>
        <button class="command-chip" type="button" data-command="BOT:ANSWER ">Answer a guess</button>
      </div>
    </form>
  </main>
</body>
</html>
